# Fernblick-Planer – Stack für docker compose / Portainer
# Oberfläche hinter einem Forward-Auth-Proxy (z. B. Traefik + Authelia, setzt Remote-User);
# /mcp, OAuth-Token/Registrierung und /.well-known öffentlich (Bearer/OAuth).
# Alle umgebungsspezifischen Werte kommen aus Variablen (siehe deploy/.env.example), keine Vorgaben im Repo.
# Daten (Modell, Versionen, Varianten, Bilder, Render-Aufträge, OAuth-SQLite) unter ${DATEN_PFAD}.
name: ${STACK:-fernblick-planer}

x-planer: &planer
  image: ${IMAGE:?IMAGE fehlt (z. B. ghcr.io/<owner>/fernblick-planer)}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  # tini als PID 1: Container reagieren auf SIGTERM (sonst hängt das Austauschen beim Update)
  init: true
  stop_grace_period: 20s
  environment:
    PLANER_DATA: /data
    PLANER_PUBLIC_URL: https://${PLANER_HOST:?PLANER_HOST fehlt}
    # Remote-User nur vom Proxy annehmen (Containername/IP des Reverse-Proxys)
    PLANER_TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES fehlt}
    # Benutzer mit Zugriff (Komma-getrennt), leer = alle beim Proxy angemeldeten
    PLANER_ALLOWED_USERS: ${ALLOWED_USERS:-}
    PLANER_RENDER_THREADS: ${RENDER_THREADS:-5}
    TZ: Europe/Berlin
  volumes:
    - ${DATEN_PFAD:?DATEN_PFAD fehlt}/data:/data

services:
  app:
    <<: *planer
    container_name: ${STACK:-fernblick-planer}
    networks: [traefik]
    mem_limit: 768m
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.services.${STACK:-fernblick-planer}.loadbalancer.server.port=8000
      - traefik.http.routers.${STACK:-fernblick-planer}.rule=Host(`${PLANER_HOST:?PLANER_HOST fehlt}`)
      - traefik.http.routers.${STACK:-fernblick-planer}.priority=10
      - traefik.http.routers.${STACK:-fernblick-planer}.entrypoints=websecure
      - traefik.http.routers.${STACK:-fernblick-planer}.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER fehlt}
      - traefik.http.routers.${STACK:-fernblick-planer}.middlewares=${TRAEFIK_MIDDLEWARES_WEB:?TRAEFIK_MIDDLEWARES_WEB fehlt (Forward-Auth-Middleware)}
      - traefik.http.routers.${STACK:-fernblick-planer}-public.rule=Host(`${PLANER_HOST:?PLANER_HOST fehlt}`) && (Path(`/mcp`) || PathPrefix(`/.well-known/`) || Path(`/oauth/token`) || Path(`/oauth/register`) || Path(`/api/health`))
      - traefik.http.routers.${STACK:-fernblick-planer}-public.priority=100
      - traefik.http.routers.${STACK:-fernblick-planer}-public.entrypoints=websecure
      - traefik.http.routers.${STACK:-fernblick-planer}-public.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER fehlt}
      - traefik.http.routers.${STACK:-fernblick-planer}-public.service=${STACK:-fernblick-planer}
      - traefik.http.routers.${STACK:-fernblick-planer}-public.middlewares=${STACK:-fernblick-planer}-ohne-sso${TRAEFIK_MIDDLEWARES_PUBLIC:+,}${TRAEFIK_MIDDLEWARES_PUBLIC:-}
      # Auf öffentlichen Pfaden nie einen vom Client gesetzten Remote-User durchreichen
      - traefik.http.middlewares.${STACK:-fernblick-planer}-ohne-sso.headers.customrequestheaders.Remote-User=
      - traefik.http.middlewares.${STACK:-fernblick-planer}-ohne-sso.headers.customrequestheaders.Remote-Groups=
      - traefik.http.middlewares.${STACK:-fernblick-planer}-ohne-sso.headers.customrequestheaders.Remote-Email=
      - traefik.http.middlewares.${STACK:-fernblick-planer}-ohne-sso.headers.customrequestheaders.Remote-Name=

  worker:
    <<: *planer
    container_name: ${STACK:-fernblick-planer}-worker
    command: ["python", "-m", "planer.render_worker"]
    healthcheck:
      disable: true
    network_mode: none
    cpus: ${RENDER_CPUS:-5}
    mem_limit: 6g

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
